<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Analytics - Department of Computer Engineering</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>

  <!-- Login screen -->
  <div id="login-root" class="d-none"></div>

  <!-- Main app shell -->
  <div id="app-root" class="d-none">

    <!-- Mobile nav offcanvas -->
    <div class="offcanvas offcanvas-start sidebar p-3" tabindex="-1" id="mobileNav" aria-label="Navigation">
      <div class="d-flex flex-column h-100">
        <div class="d-flex align-items-center gap-2 px-2 py-3 mb-2 border-bottom border-secondary border-opacity-25">
          <div class="brand-badge">
            <i class="bi bi-bar-chart-steps fs-5"></i>
          </div>
          <div>
            <h6 class="text-white fw-bold mb-0">Attendance Analytics</h6>
            <span class="sidebar-sub">Computer Engineering</span>
          </div>
          <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <nav class="nav flex-column gap-1" id="nav-mobile"></nav>
      </div>
    </div>

    <div class="d-flex">
      <aside class="sidebar sidebar-desktop d-none d-lg-flex flex-column p-3">
        <div class="d-flex align-items-center gap-2 px-2 py-3 mb-2 border-bottom border-secondary border-opacity-25">
          <div class="brand-badge">
            <i class="bi bi-bar-chart-steps fs-5"></i>
          </div>
          <div>
            <h6 class="text-white fw-bold mb-0">Attendance Analytics</h6>
            <span class="sidebar-sub">Computer Engineering</span>
          </div>
        </div>

        <nav class="nav flex-column gap-1 flex-grow-1" id="nav-desktop"></nav>

        <div class="sidebar-footer mt-auto">
          <div class="d-flex align-items-center gap-2 mb-2">
            <i class="bi bi-mortarboard-fill text-primary fs-5"></i>
            <div>
              <div class="text-white small fw-bold">Academic Year 2026–27</div>
              <div class="sidebar-sub">CO1 • CO3 • CO5 tracked</div>
            </div>
          </div>
          <div class="d-flex gap-2 mt-2">
            <span class="sem-chip">CO1</span>
            <span class="sem-chip">CO3</span>
            <span class="sem-chip">CO5</span>
          </div>
        </div>
      </aside>

      <div class="d-flex flex-column flex-grow-1" style="min-width:0;min-height:100vh">
        <header class="top-header d-flex align-items-center justify-content-between px-3 px-md-4 no-print">
          <div class="d-flex align-items-center gap-3">
            <button class="btn btn-sm btn-outline-secondary d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#mobileNav" aria-label="Open menu">
              <i class="bi bi-list fs-5"></i>
            </button>
            <div class="d-none d-sm-flex align-items-center gap-2">
              <span class="header-pill"><i class="bi bi-calendar3 me-1"></i>2026–27</span>
              <span class="header-pill d-none d-md-inline-flex"><i class="bi bi-building me-1"></i>Computer Engineering</span>
            </div>
          </div>
          <div class="d-flex align-items-center gap-2">

            <button id="refresh-btn" class="btn btn-outline-secondary btn-sm rounded-pill px-3 d-flex align-items-center gap-2" title="Fetch latest data from Google Sheets">
              <i class="bi bi-arrow-clockwise"></i>
              <span class="small d-none d-md-inline">Refresh</span>
            </button>

            <button id="theme-btn" class="btn btn-outline-secondary btn-sm rounded-pill px-3 d-flex align-items-center gap-2"></button>

            <div class="dropdown">
              <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 d-flex align-items-center gap-2 dropdown-toggle"
                      type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-circle"></i>
                <span class="d-none d-md-inline">
                  <strong id="user-name">User</strong>
                  <span class="text-muted small ms-1">· <span id="user-course">COB</span></span>
                </span>
              </button>
              <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                <li><button class="dropdown-item" type="button" id="btn-switch">
                  <i class="bi bi-arrow-left-right me-2"></i>Switch Account
                </button></li>
                <li><hr class="dropdown-divider"></li>
                <li><button class="dropdown-item text-danger" type="button" id="btn-logout">
                  <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button></li>
              </ul>
            </div>

          </div>
        </header>

        <main class="p-3 p-md-4 flex-grow-1" id="view"></main>
      </div>
    </div>
  </div>

  <!-- Manage modal -->
  <div class="modal fade" id="manageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-gear-fill me-2 text-primary"></i>Manage / Configure</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="manage-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-danger btn-sm" id="manage-reset">
            <i class="bi bi-arrow-counterclockwise me-1"></i>Reset to defaults
          </button>
          <button type="button" class="btn btn-primary btn-sm" data-bs-dismiss="modal">Done</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Generic list modal (clickable counts) -->
  <div class="modal fade" id="listModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="list-modal-title">List</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="list-modal-body"></div>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="data.js"></script>
  <script src="attendance.js"></script>
  <script src="app.js"></script>
</body>
</html>
